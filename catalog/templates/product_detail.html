{% extends "base.html" %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                <div class="col">
                    <div class="card shadow-sm">
                        <img src="{{ product.image | media_filter }}">
                        <div class="card-body">
                            <p class="card-text"><strong>Категория:</strong> {{ product.category }}</p>
                            <p class="card-text"><strong>Название:</strong> {{ product.name }}</p>
                            <p class="card-text"><strong>Описание:</strong> {{ product.description }}</p>
                            <p class="card-text"><strong>Цена:</strong> {{ product.price }}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="btn-group">
                                    <a class="btn btn-primary" href="{% url 'catalog:products_lict' %}" role="button">Назад</a>
                                </div>
                                <small class="text-body-secondary">{{ product.updated_at }}</small></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
